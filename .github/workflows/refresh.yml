name: Refresh catalog

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/refresh.py
      - run: python3 tests/test_catalog.py
      - run: python3 .home/build.py
      - name: Commit refreshed data
        run: |
          if git diff --quiet -- src/data/catalog.json; then exit 0; fi
          git config user.name "recomp-index-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/data/catalog.json
          git commit -m "data: refresh project index"
          git push
